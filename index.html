<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidianで開く</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f3ef;
    color: #2b2a28;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1f1e1c; color: #eae8e3; }
    .card { background: #2a2926 !important; }
    .btn { background: #7c5cff !important; }
    .note { color: #9a988f !important; }
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  .icon { font-size: 40px; margin-bottom: 8px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #status { font-size: 14px; color: #6b6a65; margin: 0 0 20px; line-height: 1.6; }
  .btn {
    display: inline-block;
    background: #6b4fe0;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 12px 28px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }
  .btn:active { opacity: 0.85; }
  .note { font-size: 12px; color: #9a988f; margin-top: 20px; line-height: 1.6; word-break: break-all; }
  .error { color: #c0392b; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔗</div>
    <h1 id="title">Obsidianを起動しています…</h1>
    <p id="status">自動的に開かない場合は、下のボタンをタップしてください。</p>
    <a id="open-link" class="btn" href="#" style="display:none;">Obsidianで開く</a>
    <div id="error-box" style="display:none;"></div>
    <div id="target-note" class="note"></div>
  </div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var titleEl = document.getElementById('title');
  var statusEl = document.getElementById('status');
  var linkEl = document.getElementById('open-link');
  var errorBox = document.getElementById('error-box');
  var noteEl = document.getElementById('target-note');

  function showError(message) {
    titleEl.textContent = 'リンクを開けません';
    statusEl.style.display = 'none';
    errorBox.style.display = 'block';
    errorBox.className = 'error';
    errorBox.textContent = message;
  }

  function buildTarget() {
    // 1) ?uri=<encoded full obsidian:// URI> を最優先で使う
    //    (Advanced URI プラグインでの見出し/ブロック/コマンド実行などに対応)
    var uri = params.get('uri');
    if (uri) {
      return uri;
    }

    // 2) ?vault=VaultName&file=Path/To/Note から obsidian://open を組み立てる
    var vault = params.get('vault');
    if (!vault) return null;

    var target = 'obsidian://open?vault=' + encodeURIComponent(vault);

    var file = params.get('file');
    if (file) {
      target += '&file=' + encodeURIComponent(file);
    }

    var daily = params.get('daily');
    if (daily !== null) {
      target = 'obsidian://advanced-uri?vault=' + encodeURIComponent(vault) + '&daily=true';
    }

    return target;
  }

  var target = buildTarget();

  if (!target) {
    showError('パラメータが不足しています。URLに "?vault=Vault名&file=ノートのパス" を付けてアクセスしてください。');
    return;
  }

  linkEl.href = target;
  linkEl.style.display = 'inline-block';
  noteEl.textContent = target;

  // 自動リダイレクトを試みる(デスクトップ/Androidの多くのブラウザで動作)。
  // Notionアプリ内ブラウザなど、自動起動がブロックされる環境向けに
  // ボタンは常に表示しておき、手動タップでも確実に開けるようにする。
  window.location.href = target;

  setTimeout(function () {
    titleEl.textContent = 'Obsidianアプリで開いてください';
  }, 800);
})();
</script>
</body>
</html>
